name: Site

# Publie le dossier site/ sur la branche gh-pages, servie par GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Appelé après la mise à jour des données : on prend la dernière version de la branche,
      # pas le commit qui a déclenché le workflow.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Vérifier le site et les données
        run: node scripts/check-site.mjs

      - name: Publier sur gh-pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          version="$(git rev-parse --short HEAD)"
          sed -i "s/__VERSION__/${version}/g" site/index.html site/sw.js 2>/dev/null || true
          cd site
          touch .nojekyll
          git init --quiet --initial-branch gh-pages
          git config user.name "Jonathan Levy"
          git config user.email "jonathan.levy2@etu.univ-paris1.fr"
          git add --all
          git commit --quiet -m "deploy: ${version}"
          git push --force --quiet "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" gh-pages
          echo "Publié : https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" | tr '[:upper:]' '[:lower:]'
