name: Tests

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "scripts/**"
      - "site/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Pipeline de données
        run: python -m unittest discover -s pipeline -v

      - name: Syntaxe du JavaScript
        run: for f in site/js/*.js site/sw.js; do node --check "$f"; done

      - name: Cohérence du site
        run: node scripts/check-site.mjs
