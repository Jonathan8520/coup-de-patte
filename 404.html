<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duckdle</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://jonathan8520.github.io/duckdle/">
  <script>
    // Coup de Patte s'appelle maintenant Duckdle. On garde la suite du lien (#/defi/…, #/jour…)
    // et on retire l'ancien service worker, pour ne plus servir l'ancienne version.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((list) => list.forEach((r) => r.unregister())).catch(() => {});
    }
    // L'adresse du jeu suit le nom du dépôt : on vérifie laquelle répond (duckdle ou Duckdle).
    const go = (base) => location.replace(base + location.search + location.hash);
    fetch("/duckdle/manifest.webmanifest", { method: "HEAD", cache: "no-store" })
      .then((r) => go(r.ok ? "/duckdle/" : "/Duckdle/"))
      .catch(() => go("/duckdle/"));
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=https://jonathan8520.github.io/duckdle/"></noscript>
</head>
<body style="font-family: system-ui, sans-serif; padding: 2rem;">
  <p>Coup de Patte s'appelle maintenant <a href="https://jonathan8520.github.io/duckdle/">Duckdle</a>.</p>
</body>
</html>
